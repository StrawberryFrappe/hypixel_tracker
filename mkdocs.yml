site_name: Bazaar Guru
site_description: Architecture and development notes for an unofficial Bazaar advisory assistant
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: green
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Development: development.md
  - Security: security.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
